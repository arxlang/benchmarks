name = "fibonacci"
description = "Function-call overhead, integer loops and range iteration"

# Reference implementations receive `args`. Every implementation reads n from input.txt.
[references]
c = "c/fib.c"
python = "python/fib.py"
rust = "rust/fib.rs"
go = "go/fib.go"
lua = "lua/fib.lua"
java = "java/Fib.java"
julia = "julia/fib.jl"
numba = "numba/fib.py"

[[case]]
id = "recursive_35"
args = ["recursive"]
input = "35"
expected = "9227465"
runs = 30
warmup = 5
[case.arx]
arx = "arx/recursive.x"

[[case]]
id = "recursive_40"
args = ["recursive"]
input = "40"
expected = "102334155"
runs = 5
warmup = 1
[case.arx]
arx = "arx/recursive.x"

[[case]]
id = "iterative_1m"
args = ["iterative"]
input = "1000000"
expected = "16423387200000"
runs = 30
warmup = 5
[case.arx]
arx-while = "arx/iterative_while.x"
arx-range = "arx/iterative_range.x"